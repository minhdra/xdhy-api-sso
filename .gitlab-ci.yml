stages:
  - dev

# dist/ được build sẵn ở máy dev và commit vào repo -> job chỉ deploy, không build.
# Runner: Windows server (IIS host), shell executor = PowerShell. Node.js + PM2 phải cài system-wide.
# File .env production + keys/private.pem (JWT_PRIVATE_KEY_PATH) phải có sẵn trong DEPLOY_DIR (repo không chứa).
#
# Luồng: dừng process PM2 cũ -> chép dist + package*.json -> npm i --omit=dev -> chạy lại qua PM2.
# Không đụng .env, keys/, uploads/, logs/, node_modules/ ở DEPLOY_DIR.
#
# Script giữ ASCII (không dấu) để tránh lỗi encoding khi runner ghi file .ps1.
deploy-server:
  stage: dev
  tags:
    - dev
  resource_group: production
  variables:
    DEPLOY_DIR: 'C:\inetpub\wwwroot\XayDung\api-sso'
    PM2_APP_NAME: 'xdhy-api-sso'
    PM2_CMD: 'C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd'
    PM2_HOME: 'C:\Users\Administrator\.pm2'
    LEGACY_TASK_NAME: 'api-sso'
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $src = $env:CI_PROJECT_DIR
      $dst = $env:DEPLOY_DIR
      $pm2Name = $env:PM2_APP_NAME
      $legacyTask = $env:LEGACY_TASK_NAME

      function Fail($msg) { Write-Host "ERROR: $msg"; exit 1 }
      function Resolve-Pm2 {
        if ($env:PM2_CMD -and (Test-Path $env:PM2_CMD)) { return $env:PM2_CMD }
        $command = Get-Command pm2.cmd -ErrorAction SilentlyContinue
        if ($command) { return $command.Source }
        $candidates = @(Get-ChildItem 'C:\Users\*\AppData\Roaming\npm\pm2.cmd' -ErrorAction SilentlyContinue)
        if ($candidates.Count -eq 0) { Fail 'Khong tim thay pm2.cmd. Cai PM2 global hoac khai bao PM2_CMD trong GitLab CI/CD Variables.' }
        $selected = $candidates | Where-Object {
          $profile = Split-Path (Split-Path (Split-Path (Split-Path $_.FullName -Parent) -Parent) -Parent) -Parent
          $dump = Join-Path $profile '.pm2\dump.pm2'
          (Test-Path $dump) -and (Select-String -Path $dump -SimpleMatch $pm2Name -Quiet)
        } | Select-Object -First 1
        if (-not $selected) { $selected = $candidates | Select-Object -First 1 }
        if (-not $env:PM2_HOME) {
          $profile = Split-Path (Split-Path (Split-Path (Split-Path $selected.FullName -Parent) -Parent) -Parent) -Parent
          $env:PM2_HOME = Join-Path $profile '.pm2'
        }
        return $selected.FullName
      }

      # --- 0. kiem tra dau vao
      if (-not (Test-Path "$src\dist\index.js")) { Fail 'Khong co dist\index.js trong repo. Chay npm run build roi commit ca thu muc dist.' }
      if (-not (Get-Command npm.cmd -ErrorAction SilentlyContinue)) { Fail 'Khong tim thay npm trong PATH cua runner (cai Node.js system-wide).' }
      if (-not (Test-Path "$dst\.env")) { Fail "Thieu $dst\.env - tao .env production tren server truoc." }
      $pm2 = Resolve-Pm2
      Write-Host "PM2: $pm2 (PM2_HOME=$env:PM2_HOME)"

      # Port lay tu .env dich (config.ts: PORT mac dinh 6005)
      $port = 6005
      $m = Select-String -Path "$dst\.env" -Pattern '^\s*PORT\s*=\s*(\d+)' | Select-Object -First 1
      if ($m) { $port = [int]$m.Matches[0].Groups[1].Value }
      Write-Host "Deploy $src -> $dst (port $port)"

      # --- 1. dung process cu truoc khi chep/npm i (Windows khoa file .node cua bcrypt khi dang chay)
      & $pm2 describe $pm2Name *> $null
      if ($LASTEXITCODE -eq 0) {
        & $pm2 delete $pm2Name
        if ($LASTEXITCODE -ne 0) { Fail "Khong dung duoc PM2 process $pm2Name." }
      }
      $global:LASTEXITCODE = 0
      if (Get-ScheduledTask -TaskName $legacyTask -ErrorAction SilentlyContinue) {
        Stop-ScheduledTask -TaskName $legacyTask -ErrorAction SilentlyContinue
        Unregister-ScheduledTask -TaskName $legacyTask -Confirm:$false
      }
      # Chot chan: process mo coi (chay tay...) con giu port thi kill not.
      foreach ($c in @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)) {
        Write-Host "Kill PID $($c.OwningProcess) dang giu port $port"
        Stop-Process -Id $c.OwningProcess -Force -ErrorAction SilentlyContinue
      }
      Start-Sleep -Seconds 2

      # --- 2. chep file (robocopy exit code < 8 la OK; /MIR chi ap dung cho dist)
      robocopy "$src\dist" "$dst\dist" /MIR /NFL /NDL /NJH /NJS /NP
      if ($LASTEXITCODE -ge 8) { Fail "robocopy loi (exit $LASTEXITCODE)" }
      $global:LASTEXITCODE = 0
      Copy-Item "$src\package.json" $dst -Force
      # Repo dung pnpm, chua co package-lock.json -> npm i se tu resolve theo range trong package.json.
      if (Test-Path "$src\package-lock.json") { Copy-Item "$src\package-lock.json" $dst -Force }

      # --- 3. npm i (khong dung npm ci: repo dung pnpm, khong co package-lock.json dong bo)
      # bcrypt tu tai binary native qua install script cua no.
      Push-Location $dst
      npm.cmd i --omit=dev --no-audit --no-fund
      $npmExit = $LASTEXITCODE
      Pop-Location
      if ($npmExit -ne 0) { Fail "npm i loi (exit $npmExit)" }
      $global:LASTEXITCODE = 0

      # --- 4. chay lai qua PM2. cwd bat buoc la DEPLOY_DIR de dotenv/uploads dung dung duong dan.
      $env:NODE_ENV = 'production'
      $env:NODE_OPTIONS = '--max-http-header-size=10485760'
      & $pm2 start "$dst\dist\index.js" --name $pm2Name --cwd $dst --time
      if ($LASTEXITCODE -ne 0) { Fail "pm2 start $pm2Name loi (exit $LASTEXITCODE)" }
      & $pm2 save
      if ($LASTEXITCODE -ne 0) { Fail "pm2 save loi (exit $LASTEXITCODE)" }

      # --- 5. cho port lang nghe toi da 60s
      $up = $false
      for ($i = 0; $i -lt 30; $i++) {
        Start-Sleep -Seconds 2
        if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { $up = $true; break }
      }
      if (-not $up) {
        Write-Host "--- PM2 logs: $pm2Name ---"
        & $pm2 logs $pm2Name --nostream --lines 50
        Fail "api-sso khong lang nghe port $port sau 60s."
      }
      Write-Host "OK: $pm2Name dang chay o port $port"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
